services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - SURI_SHARED_SECRET=${SURI_SHARED_SECRET:-}
      - SURI_API_BASE_URL=${SURI_API_BASE_URL:-}
      - SURI_API_TOKEN=${SURI_API_TOKEN:-}
      - SURI_SEND_MESSAGE_PATH=${SURI_SEND_MESSAGE_PATH:-/messages/send}
      - SURI_CHATBOT_ID=${SURI_CHATBOT_ID:-}
    restart: unless-stopped
